<style>
:root{--bg:#020914;--panel:#06182b;--panel2:#071f38;--line:#07558d;--cyan:#10d8ff;--blue:#168bff;--text:#eef7ff;--muted:#92b3d4;--green:#00e0be;--purple:#a68bff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0%,#08264a 0%,var(--bg) 48%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid #12334f;background:rgba(2,12,24,.92);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.logo{width:100%;height:96px;object-fit:contain;border-radius:10px}.brand-fallback{font-weight:900;letter-spacing:2px;color:var(--cyan);font-size:22px;text-align:center;padding:20px 0}.brand-sub{font-size:10px;color:#c6e8ff;text-align:center;margin-top:-18px}
.nav{display:grid;gap:8px}.nav button{background:transparent;border:1px solid transparent;color:#b8d5f1;text-align:left;padding:13px 12px;border-radius:10px;cursor:pointer;font-size:13px;transition:.18s}.nav button:hover,.nav button.active{background:linear-gradient(100deg,#063c79,#062449);border-color:#0879c6;color:white;box-shadow:inset 3px 0 var(--cyan)}.nav .ico{display:inline-block;width:28px;color:var(--cyan);font-size:16px}.side-bottom{margin-top:auto;color:#4fcaff;font-size:12px;font-style:italic;line-height:1.6;padding:8px}
main{padding:26px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #12466d;padding-bottom:18px;margin-bottom:18px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--cyan);font-weight:700}.topbar h1{font-size:27px;margin:5px 0 4px}.subtitle{color:#b4cde4;font-size:13px}.topright{display:flex;align-items:center;gap:12px}.pill{border:1px solid #12548a;background:#04182c;border-radius:10px;padding:10px 13px;color:#cfe7ff;font-size:12px}
.filters{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:9px;margin-bottom:20px}.filter{background:linear-gradient(135deg,#061a30,#041324);border:1px solid #07548b;border-radius:9px;padding:9px 10px;min-width:0}.filter label{display:block;color:#82c7f7;font-size:10px;margin-bottom:6px}.filter select,.filter input{width:100%;background:transparent;border:0;outline:0;color:white;font-size:12px}.filter option{background:#06182b;color:white}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.kpi{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(5,31,55,.97),rgba(2,15,29,.96));border:1px solid #0785c6;border-radius:13px;padding:17px 19px;box-shadow:0 0 20px rgba(0,151,255,.06)}.kpi:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(0,183,255,.08);right:-35px;top:-40px}.kpi-head{font-size:11px;color:#b9d7f1;letter-spacing:.7px}.kpi-icon{display:inline-grid;place-items:center;border:1px solid #087cc0;background:#063d78;color:var(--cyan);width:35px;height:35px;border-radius:9px;margin-right:9px;font-size:18px;vertical-align:middle}.kpi-value{font-size:28px;font-weight:750;letter-spacing:-.7px;margin:13px 0 6px;overflow-wrap:anywhere}.kpi-foot{font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:13px;margin-bottom:13px}.panel{background:linear-gradient(145deg,rgba(4,23,42,.97),rgba(2,14,27,.97));border:1px solid #075a93;border-radius:13px;padding:16px;min-width:0;box-shadow:0 8px 28px rgba(0,0,0,.12)}.panel h2{font-size:14px;margin:0 0 10px;padding-bottom:12px;border-bottom:1px solid #103451}.panel h2 span{color:var(--cyan);margin-right:9px}.chart{height:270px;width:100%}.chart.small{height:240px}.table-wrap{overflow:auto;max-height:310px}table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}th{text-align:left;color:#9cc5e7;font-weight:600;padding:11px 9px;border-bottom:1px solid #143a58}td{padding:10px 9px;border-bottom:1px solid rgba(20,58,88,.65);color:#e1efff}tr:hover td{background:rgba(0,139,255,.07)}.status{display:inline-block;border-radius:20px;padding:4px 9px;background:#063e55;color:#7fffe6;border:1px solid #087b8e;font-size:10px}.empty{color:var(--muted);padding:28px;text-align:center;font-size:13px}.footnote{font-size:10px;color:#6688a7;margin-top:15px;line-height:1.5}.section-title{font-size:21px;margin:4px 0 4px}.section-desc{color:var(--muted);font-size:12px;margin-bottom:18px}.hidden{display:none!important}
@media(max-width:1100px){.app{grid-template-columns:205px minmax(0,1fr)}main{padding:18px}.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}

</style>

const allSheets = DATA.sheets || {};
const sheetNames = Object.keys(allSheets);
const findSheet = (patterns) => sheetNames.find(s => patterns.some(p => s.toLowerCase().includes(p))) || "";
const salesSheet = findSheet(["pedido_vendas","pedido","venda"]);
const financeSheet = findSheet(["financeiro_comercial","financeiro","comercial"]);
const clientSheet = findSheet(["clientes","cliente"]);
const partnerSheet = findSheet(["tecnicos_parceiros","tecnicos","parceiros"]);
const getRows = (s) => allSheets[s] || [];
let page = "overview";

const palette = {paper:"#06182b",text:"#dceeff",muted:"#8fb2d4",cyan:"#12d8ff",blue:"#148cff",green:"#00d8be",purple:"#9c86ff"};
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const keyOf = (obj, terms) => Object.keys(obj||{}).find(k => terms.some(t => norm(k).includes(norm(t)))) || "";
const val = (r, terms) => {const k=keyOf(r,terms); return k ? r[k] : null};
const num = v => { if(typeof v==="number") return v; if(v==null||v==="")return 0; let s=String(v).replace(/[R$\s]/g,""); if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",","."); else if(s.includes(","))s=s.replace(",","."); const n=Number(s); return Number.isFinite(n)?n:0; };
const money = n => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}).format(n||0);
const pct = n => (Number.isFinite(n)?n:0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
const dateObj = v => { if(!v)return null; if(v instanceof Date)return v; let s=String(v); let d=new Date(s); if(!isNaN(d))return d; const m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); if(m)return new Date(+m[3],+m[2]-1,+m[1]); return null; };
const dateLabel = v => {const d=dateObj(v);return d?d.toLocaleDateString("pt-BR"):(v==null?"—":String(v));};
const rowsFor = sheet => getRows(sheet);
function mergedSales(){
 const raw = rowsFor(financeSheet).length ? rowsFor(financeSheet) : rowsFor(salesSheet);
 return raw.map((r,i)=>{
  const sale=num(val(r,["valor de venda","valor venda","faturamento","valor total","valor"]));
  const productCost=num(val(r,["custo do produto","custo produto","custo mercadoria"]));
  const installCost=num(val(r,["custo instalacao","custo de instalacao","instalacao"]));
  const gross= sale-productCost-installCost;
  return {...r,__sale:sale,__productCost:productCost,__installCost:installCost,__cost:productCost+installCost,__gross:gross,__margin:sale?gross/sale*100:0,
   __date:val(r,["data","data venda","data do pedido"]),__client:val(r,["cliente","nome cliente"]),__product:val(r,["produto/servico","produto","servico"]),__supplier:val(r,["fornecedor","tecnico","parceiro"]),__payment:val(r,["forma de pagamento","pagamento"]),__status:val(r,["status"])};
 });
}
const originalSales=mergedSales();
function optionsFor(field){let vals=[...new Set(originalSales.map(r=>r[field]).filter(v=>v!=null&&String(v).trim()!=="").map(String))].sort();return ["Todos",...vals];}
function makeFilter(id,label,opts){return `<div class="filter"><label>${label}</label><select id="${id}">${opts.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("")}</select></div>`;}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function setupFilters(){
 const f=document.getElementById("filters");
 f.innerHTML=makeFilter("period","◷ Período",["Todos",...new Set(originalSales.map(r=>{const d=dateObj(r.__date);return d?String(d.getFullYear()):null}).filter(Boolean))])+makeFilter("client","♙ Cliente",optionsFor("__client"))+makeFilter("product","⬡ Produto/Serviço",optionsFor("__product"))+makeFilter("supplier","♧ Fornecedor/Técnico",optionsFor("__supplier"))+makeFilter("payment","▣ Forma de pagamento",optionsFor("__payment"))+makeFilter("status","☷ Status",optionsFor("__status"));
 Object.keys(state).forEach(k=>{const el=document.getElementById(k);el.addEventListener("change",()=>{state[k]=el.value;render()})});
}
function filtered(){return originalSales.filter(r=>{
 const d=dateObj(r.__date), year=d?String(d.getFullYear()):"";
 return (state.period==="Todos"||year===state.period)&&
 (state.client==="Todos"||String(r.__client??"")===state.client)&&
 (state.product==="Todos"||String(r.__product??"")===state.product)&&
 (state.supplier==="Todos"||String(r.__supplier??"")===state.supplier)&&
 (state.payment==="Todos"||String(r.__payment??"")===state.payment)&&
 (state.status==="Todos"||String(r.__status??"")===state.status);
 });}
function sum(a,k){return a.reduce((s,r)=>s+(r[k]||0),0)}
function plotBase(){return {paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{color:"#a9c9e7",family:"Inter,Segoe UI,Arial"},margin:{l:52,r:14,t:12,b:44},legend:{orientation:"h",y:-.2},xaxis:{gridcolor:"#102e48",linecolor:"#1c4969"},yaxis:{gridcolor:"#102e48",linecolor:"#1c4969",tickprefix:"R$ "}}}
function plot(id,traces,layout){const el=document.getElementById(id); if(!window.Plotly){el.innerHTML='<div class="empty">Os gráficos precisam de conexão com a internet para carregar.</div>';return;} Plotly.react(el,traces,{...plotBase(),...layout},{responsive:true,displayModeBar:false});}
function kpi(icon,label,value,foot){return `<div class="kpi"><div class="kpi-head"><span class="kpi-icon">${icon}</span>${label}</div><div class="kpi-value">${value}</div><div class="kpi-foot">${foot}</div></div>`}
function renderOverview(a){

 const monthly={};a.forEach(r=>{const d=dateObj(r.__date);if(d){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(!monthly[k])monthly[k]={rev:0,cost:0,gross:0};monthly[k].rev+=r.__sale;monthly[k].cost+=r.__cost;monthly[k].gross+=r.__gross}});

 const last=a.slice().sort((x,y)=>(dateObj(y.__date)?.getTime()||0)-(dateObj(x.__date)?.getTime()||0)).slice(0,8);
 renderTable(last);
 document.getElementById("dataNote").textContent=`Base utilizada: ${financeSheet||salesSheet||"nenhuma aba de vendas identificada"}. Lucro bruto recalculado automaticamente. ${top?"Produto com maior faturamento nesta seleção: "+top[0]+".":""} Os campos sem informação na planilha permanecem sem preenchimento.`;
}
